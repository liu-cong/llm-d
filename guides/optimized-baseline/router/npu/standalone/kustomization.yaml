apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../standalone

configMapGenerator:
  - name: epp-config
    behavior: replace
    files:
      - epp-config.yaml

patches:
  - target:
      kind: InferencePool
    patch: |
      - op: replace
        path: /spec/selector/matchLabels
        value:
          llm-d.ai/guide: optimized-baseline
          llm-d.ai/accelerator-variant: npu
          llm-d.ai/accelerator-vendor: rebellions
