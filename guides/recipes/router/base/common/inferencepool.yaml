apiVersion: inference.networking.k8s.io/v1
kind: InferencePool
metadata:
  name: inference-pool
  labels:
    app.kubernetes.io/name: epp
spec:
  targetPorts:
    - number: 8000
  selector:
    matchLabels:
      llm-d.ai/inference-serving: "true"
  endpointPickerRef:
    name: epp
    port:
      number: 9002
