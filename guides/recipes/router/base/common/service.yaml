apiVersion: v1
kind: Service
metadata:
  name: epp
  labels:
    app.kubernetes.io/name: epp
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: epp
  ports:
    - name: grpc-ext-proc
      port: 9002
      targetPort: 9002
      protocol: TCP
    - name: http-metrics
      port: 9090
      targetPort: 9090
      protocol: TCP
