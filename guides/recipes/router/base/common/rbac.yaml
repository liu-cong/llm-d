apiVersion: v1
kind: ServiceAccount
metadata:
  name: epp
  labels:
    app.kubernetes.io/name: epp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: epp
  labels:
    app.kubernetes.io/name: epp
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "watch", "list"]
  - apiGroups: ["inference.networking.x-k8s.io"]
    resources: ["inferenceobjectives", "inferencepoolimports", "inferencemodelrewrites"]
    verbs: ["get", "watch", "list"]
  - apiGroups: ["inference.networking.k8s.io"]
    resources: ["inferencepools"]
    verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: epp
  labels:
    app.kubernetes.io/name: epp
subjects:
  - kind: ServiceAccount
    name: epp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: epp
