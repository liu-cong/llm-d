apiVersion: apps/v1
kind: Deployment
metadata:
  name: epp
spec:
  template:
    spec:
      containers:
        - name: epp
        - name: vllm-render
          image: docker.io/vllm/vllm-openai-cpu:v0.19.1
          imagePullPolicy: IfNotPresent
          command:
            - vllm
            - launch
            - render
          args:
            - Qwen/Qwen3-32B
            - --port
            - "8000"
          env:
            - name: HF_HOME
              value: /data
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: llm-d-hf-token
                  key: HF_TOKEN
          ports:
            - name: render-http
              containerPort: 8000
          resources:
            requests:
              cpu: "4"
              memory: 8Gi
          readinessProbe:
            httpGet:
              path: /health
              port: render-http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          volumeMounts:
            - name: model-cache
              mountPath: /data
      volumes:
        - name: model-cache
          emptyDir: {}
