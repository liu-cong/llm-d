apiVersion: v1
kind: ConfigMap
metadata:
  name: epp-latency-predictor-training
  labels:
    app.kubernetes.io/name: epp
data:
  LATENCY_RETRAINING_INTERVAL_SEC: "1"
  LATENCY_MIN_SAMPLES_FOR_RETRAIN: "100"
  LATENCY_TTFT_MODEL_PATH: "/models/ttft.joblib"
  LATENCY_TPOT_MODEL_PATH: "/models/tpot.joblib"
  LATENCY_TRAINING_PORT: "8000"
  LATENCY_MODEL_TYPE: "xgboost"
  LATENCY_QUANTILE: "0.9"
  LATENCY_MAX_TRAINING_SIZE: "5000"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: epp-latency-predictor-prediction
  labels:
    app.kubernetes.io/name: epp
data:
  LATENCY_SYNC_INTERVAL_SEC: "1"
  LATENCY_TTFT_MODEL_LOCAL_PATH: "/local_models/ttft.joblib"
  LATENCY_TPOT_MODEL_LOCAL_PATH: "/local_models/tpot.joblib"
  TRAINING_SERVER_URL: "http://localhost:8000"
  LATENCY_SERVER_PORT: "8001"
  PREDICT_HOST: "127.0.0.1"
  LATENCY_MODEL_TYPE: "xgboost"
  HTTP_TIMEOUT: "10.0"
