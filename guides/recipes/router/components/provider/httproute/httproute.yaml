apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: httproute
  labels:
    app.kubernetes.io/name: epp
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: llm-d-inference-gateway
  rules:
    - backendRefs:
        - group: inference.networking.k8s.io
          kind: InferencePool
          name: inference-pool
      matches:
        - path:
            type: PathPrefix
            value: /
      timeouts:
        request: 0s
