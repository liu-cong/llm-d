apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - proxy-deployment.yaml
  - proxy-service.yaml

patches:
  - path: patch-remove-sidecar.yaml
    target:
      kind: Deployment
      name: epp
  - path: patch-service-remove-http.yaml
    target:
      kind: Service
      name: epp
