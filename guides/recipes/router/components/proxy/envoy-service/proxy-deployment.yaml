apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxy
  labels:
    app.kubernetes.io/name: proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: proxy
    spec:
      terminationGracePeriodSeconds: 130
      containers:
        - name: envoy-proxy
          image: docker.io/envoyproxy/envoy:distroless-v1.33.2
          imagePullPolicy: IfNotPresent
          command:
            - envoy
          args:
            - --service-node
            - envoy-proxy
            - --log-level
            - warn
            - --cpuset-threads
            - --drain-strategy
            - immediate
            - --drain-time-s
            - "60"
            - -c
            - /etc/envoy/envoy.yaml
          ports:
            - name: http-8081
              containerPort: 8081
            - name: metrics-19001
              containerPort: 19001
          readinessProbe:
            httpGet:
              path: /ready
              port: 19001
              scheme: HTTP
            periodSeconds: 5
            timeoutSeconds: 1
            successThreshold: 1
            failureThreshold: 1
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          resources:
            requests:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: envoy-config-volume
              mountPath: /etc/envoy
              readOnly: true
      volumes:
        - name: envoy-config-volume
          configMap:
            name: envoy-config
            items:
              - key: envoy.yaml
                path: envoy.yaml
