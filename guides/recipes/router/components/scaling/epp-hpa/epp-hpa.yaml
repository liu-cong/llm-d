apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: epp
  labels:
    app.kubernetes.io/name: epp
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: epp
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
