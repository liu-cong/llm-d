apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: epp-leader-election
  labels:
    app.kubernetes.io/name: epp
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: epp-leader-election
  labels:
    app.kubernetes.io/name: epp
subjects:
  - kind: ServiceAccount
    name: epp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: epp-leader-election
