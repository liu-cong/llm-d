apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

configMapGenerator:
  - name: epp-config
    behavior: replace
    files:
      - epp-config.yaml

patches:
  - target:
      kind: InferencePool
      name: inference-pool
    patch: |-
      - op: replace
        path: /spec/selector/matchLabels/llm-d.ai~1guide
        value: optimized-baseline
