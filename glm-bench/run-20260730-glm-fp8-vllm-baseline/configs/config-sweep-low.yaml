# D1 low-range saturation sweep: c16 -> c32 -> c48, 7 min per stage, native corpus (288<=391).
load:
  type: trace_session_replay
  stages:
  - concurrent_sessions: 16
    num_sessions: 48
    timeout: 420
  - concurrent_sessions: 32
    num_sessions: 96
    timeout: 420
  - concurrent_sessions: 48
    num_sessions: 144
    timeout: 420
  num_workers: 8
  worker_max_concurrency: 256
  request_timeout: 1800
api:
  type: chat
  streaming: true
server:
  type: vllm
  model_name: glm-5.2-fp8
  base_url: http://optimized-baseline-epp.glm-bench.svc.cluster.local:80
  ignore_eos: true
tokenizer:
  pretrained_model_name_or_path: /tokenizer
data:
  type: weka_trace_replay
  weka_trace_replay:
    hf_dataset_path: semianalysisai/cc-traces-weka-with-subagents-060826-256k
    num_dataset_entries: 391
    use_static_model: true
    static_model_name: glm-5.2-fp8
    default_block_size: 64
    skip_invalid_files: true
report:
  request_lifecycle:
    summary: true
    per_stage: true
    per_request: true

