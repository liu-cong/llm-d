# D3: improved llm-d EPP config for the P/D-disaggregated wide-EP deployment.
# Overwrites ConfigMap pd-epp (D2 router) and restarts the pd-epp deployment;
# the serving stack (prefill/decode LWS) is unchanged from D2.
#
# Source: instruction.md "D3" recommended EPP configmap, adapted:
#   - namespace prediction -> glm-bench, name -> pd-epp
#   - non-vLLM reference data layer (metrics port 7080, defaultEngine sglang)
#     -> default vLLM data layer (metrics scraped from the target port)
#   - placeholders filled from measurements on THIS deployment (see README.md):
#       7400    prompt_tokens/TTFT median, cache-miss prefills,
#                                low concurrency, per prefill endpoint (DP rank)
#       111000           per-rank KV tokens (GPU, from vllm startup log,
#                                scaled by (1 + cpu_offload_ratio)) / 64
#       300000           served max-model-len (300000)
#       0 / 4 /
#       0 / 56
#                                utilization filter caps (see README.md)
apiVersion: v1
kind: ConfigMap
metadata:
  name: pd-epp
  namespace: glm-bench
  labels:
    app.kubernetes.io/name: pd-epp
data:
  wide-ep-lws-config.yaml: |
    apiVersion: llm-d.ai/v1alpha1
    kind: EndpointPickerConfig
    plugins:
    # ---- P/D disaggregation machinery ----
    - type: disagg-headers-handler
    - type: always-disagg-pd-decider
    - type: disagg-profile-handler
      parameters:
        deciderPluginName: always-disagg-pd-decider
    - type: prefill-filter
    - type: decode-filter
    # ---- prefix-cache tracking (drives affinity on the prefill profile) ----
    - type: approx-prefix-cache-producer
      parameters:
        autoTune: false
        blockSizeTokens: 64                       # match the engine page size
        lruCapacityPerServer: 122000  # (1.196M GPU + 6.65M CPU-offload tokens)/64 per rank
        maxPrefixTokensToMatch: 300000
    - type: inflight-load-producer
    # ---- utilization filters: drop pods over limit BEFORE they shed ----
    # OR semantics: a pod is dropped when ANY condition's metric exceeds its
    # maxValue. fallbackOnEmpty keeps this fail-open.
    - name: prefill-utilization-filter
      type: utilization-filter
      parameters:
        conditions:
        - metric: waiting-queue
          maxValue: 0
        # running-requests (server-reported) rather than active-requests
        # (EPP-tracked): the EPP releases a prefill profile's request count
        # only at end of stream today, so active-requests would count requests
        # already decoding elsewhere.
        - metric: running-requests
          maxValue: 8
        fallbackOnEmpty: true
    - name: decode-utilization-filter
      type: utilization-filter
      parameters:
        conditions:
        - metric: waiting-queue
          maxValue: 0
        - metric: active-requests
          maxValue: 56
        fallbackOnEmpty: true
    # ---- scorers ----
    - type: prefix-cache-affinity-filter
      parameters:
        peakPrefillThroughput: 4741   # measured a4-pr DEP16: 205,377 cold tok / 43.3s per DP rank
    - type: token-load-scorer
    - type: active-request-scorer
    # ---- data layer (vLLM: metrics scraped from the pool target ports) ----
    - type: metrics-data-source
    - type: core-metrics-extractor
    schedulingProfiles:
    - name: prefill
      plugins:
      - pluginRef: prefill-filter
      - pluginRef: prefill-utilization-filter
      - pluginRef: prefix-cache-affinity-filter
      - pluginRef: token-load-scorer
    - name: decode
      plugins:
      - pluginRef: decode-filter
      - pluginRef: decode-utilization-filter
      - pluginRef: active-request-scorer
